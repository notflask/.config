# ============================================================
#  AeroSpace – Tasten wie in Hyprland (linux/.config/hypr/hyprland.lua)
#  Mod = Option (alt) statt Super. AeroSpace kennt kein „nur linkes
#  Option“ – beide Option-Tasten gelten.
#
#  Was macOS oder Raycast selbst übernimmt (keine Bindung hier):
#    Starter, Zwischenablage-Verlauf   Raycast (⌥Space, in Raycast einstellen)
#    Hell/Dunkel                       Systemeinstellungen → Erscheinungsbild „Automatisch“
#    Sperren                           ⌃⌘Q
#    Fensterwechsel                    ⌘Tab
#    Lautstärke, Helligkeit, Medien    Funktionstasten
# ============================================================

config-version = 2

# Rahmen ums aktive Fenster (JankyBorders, Farben von matugen:
# ~/.config/borders/bordersrc, theme.sh lädt sie neu)
after-startup-command = ['exec-and-forget borders']

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# 'auto': breiter Monitor → nebeneinander, hoher → untereinander
default-root-container-orientation = 'auto'

# Maus springt mit, wenn der Fokus auf einen anderen Monitor wechselt
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Arbeitsflächen bleiben auch leer bestehen (Mod+1 … Mod+7)
persistent-workspaces = ["BROWSER", "DEV", "MSG", "NOTES", "TRADING", "RECORDING", "MISC"]

# Programme aus exec-and-forget finden Homebrew und cargo (emacsclient, matugen …)
[exec]
    inherit-env-vars = true
[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.cargo/bin:${HOME}/.local/bin:${PATH}'

# Tasten nach Lage (QWERTY), nicht nach Sprache: Mod+H bleibt Mod+H auch
# mit russischer oder deutscher Belegung
[key-mapping]
    preset = 'qwerty'

# Wie Hyprland: 8 zwischen Fenstern, 8 zum Rand
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.top        = 8
    outer.right      = 8

# ─── Haupttasten ──────────────────────────────────────────────────────────────
[mode.main.binding]

    # Programme
    alt-t = 'exec-and-forget open -na Ghostty'
    alt-n = "exec-and-forget emacsclient -c -a ''"

    alt-q = 'close'

    # Fokus
    alt-h     = 'focus left'
    alt-j     = 'focus down'
    alt-k     = 'focus up'
    alt-l     = 'focus right'
    alt-left  = 'focus left'
    alt-down  = 'focus down'
    alt-up    = 'focus up'
    alt-right = 'focus right'

    # Fenster verschieben
    alt-ctrl-h     = 'move left'
    alt-ctrl-j     = 'move down'
    alt-ctrl-k     = 'move up'
    alt-ctrl-l     = 'move right'
    alt-ctrl-left  = 'move left'
    alt-ctrl-down  = 'move down'
    alt-ctrl-up    = 'move up'
    alt-ctrl-right = 'move right'

    # Fokus auf anderen Monitor
    alt-shift-h     = 'focus-monitor left'
    alt-shift-j     = 'focus-monitor down'
    alt-shift-k     = 'focus-monitor up'
    alt-shift-l     = 'focus-monitor right'
    alt-shift-left  = 'focus-monitor left'
    alt-shift-down  = 'focus-monitor down'
    alt-shift-up    = 'focus-monitor up'
    alt-shift-right = 'focus-monitor right'

    # Fenster auf anderen Monitor
    alt-ctrl-shift-h     = 'move-node-to-monitor --focus-follows-window left'
    alt-ctrl-shift-j     = 'move-node-to-monitor --focus-follows-window down'
    alt-ctrl-shift-k     = 'move-node-to-monitor --focus-follows-window up'
    alt-ctrl-shift-l     = 'move-node-to-monitor --focus-follows-window right'
    alt-ctrl-shift-left  = 'move-node-to-monitor --focus-follows-window left'
    alt-ctrl-shift-down  = 'move-node-to-monitor --focus-follows-window down'
    alt-ctrl-shift-up    = 'move-node-to-monitor --focus-follows-window up'
    alt-ctrl-shift-right = 'move-node-to-monitor --focus-follows-window right'

    # Arbeitsfläche runter/hoch (U/I, Bild ab/auf)
    alt-u        = 'workspace next'
    alt-i        = 'workspace prev'
    alt-pageDown = 'workspace next'
    alt-pageUp   = 'workspace prev'
    alt-ctrl-u        = 'move-node-to-workspace --focus-follows-window next'
    alt-ctrl-i        = 'move-node-to-workspace --focus-follows-window prev'
    alt-ctrl-pageDown = 'move-node-to-workspace --focus-follows-window next'
    alt-ctrl-pageUp   = 'move-node-to-workspace --focus-follows-window prev'

    # Arbeitsfläche wählen
    alt-1 = 'workspace BROWSER'
    alt-2 = 'workspace DEV'
    alt-3 = 'workspace MSG'
    alt-4 = 'workspace NOTES'
    alt-5 = 'workspace TRADING'
    alt-6 = 'workspace RECORDING'
    alt-7 = 'workspace MISC'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Fenster auf Arbeitsfläche
    alt-ctrl-1 = 'move-node-to-workspace BROWSER'
    alt-ctrl-2 = 'move-node-to-workspace DEV'
    alt-ctrl-3 = 'move-node-to-workspace MSG'
    alt-ctrl-4 = 'move-node-to-workspace NOTES'
    alt-ctrl-5 = 'move-node-to-workspace TRADING'
    alt-ctrl-6 = 'move-node-to-workspace RECORDING'
    alt-ctrl-7 = 'move-node-to-workspace MISC'
    alt-ctrl-8 = 'move-node-to-workspace 8'
    alt-ctrl-9 = 'move-node-to-workspace 9'

    # Fenster mit dem Nachbarn zusammenfassen (consume-or-expel)
    alt-leftSquareBracket  = 'join-with left'
    alt-rightSquareBracket = 'join-with right'

    # Tabs (toggle-column-tabbed-display) → Akkordeon
    alt-w = 'layout accordion tiles'
    # Teilungsrichtung umschalten
    alt-slash = 'layout horizontal vertical'

    # Maximieren bzw. echtes macOS-Vollbild
    alt-f      = 'fullscreen'
    alt-m      = 'fullscreen'
    alt-ctrl-f = 'fullscreen'
    alt-shift-f = 'macos-native-fullscreen'

    # Alle Fenster gleichmäßig aufteilen
    alt-e      = 'balance-sizes'
    alt-ctrl-r = 'balance-sizes'

    # Größe: Breite (−/=), Höhe (Shift)
    alt-minus       = 'resize width -100'
    alt-equal       = 'resize width +100'
    alt-shift-minus = 'resize height -100'
    alt-shift-equal = 'resize height +100'

    # Schwebend ↔ gekachelt
    alt-v = 'layout floating tiling'

    # Bildschirmfoto: Bereich wählen → Zwischenablage
    alt-shift-s = 'exec-and-forget screencapture -ic'

    # Service-Modus
    alt-shift-semicolon = 'mode service'

# ─── Service-Modus ────────────────────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']   # Layout zurücksetzen
    f         = ['layout floating tiling', 'mode main']   # schwebend/gekachelt
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-ctrl-h = ['join-with left',  'mode main']
    alt-ctrl-j = ['join-with down',  'mode main']
    alt-ctrl-k = ['join-with up',    'mode main']
    alt-ctrl-l = ['join-with right', 'mode main']

# ─── Regeln für neue Fenster ──────────────────────────────────────────────────
# Der erste Block ohne Bedingung gilt für alle Fenster;
# check-further-callbacks = true lässt danach die Regeln mit app-id greifen.

[[on-window-detected]]
check-further-callbacks = true
run = 'layout tiling'

# Maclock – schwebend
[[on-window-detected]]
if.app-name-regex-substring = 'Maclock'
run = 'layout floating'

# Raycast-Fenster (Einstellungen usw.) nicht kacheln
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# BROWSER
[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = ['move-node-to-workspace BROWSER', 'workspace BROWSER']

# DEV
[[on-window-detected]]
if.app-id = 'com.jetbrains.clion'
run = ['move-node-to-workspace DEV', 'workspace DEV']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace DEV', 'workspace DEV']

# MSG
[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['move-node-to-workspace MSG', 'workspace MSG']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace MSG', 'workspace MSG']

[[on-window-detected]]
if.app-id = 'dev.vencord.vesktop'
run = ['move-node-to-workspace MSG', 'workspace MSG']

# NOTES
[[on-window-detected]]
if.app-name-regex-substring = 'Notion'
run = ['move-node-to-workspace NOTES', 'workspace NOTES']

[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian'
run = ['move-node-to-workspace NOTES', 'workspace NOTES']

# TRADING
[[on-window-detected]]
if.app-id = 'com.tradingview.tradingviewapp.desktop'
run = ['move-node-to-workspace TRADING', 'workspace TRADING']

# RECORDING
[[on-window-detected]]
if.app-name-regex-substring = 'OBS'
run = ['move-node-to-workspace RECORDING', 'workspace RECORDING']
