# ============================================================
#  AeroSpace – Tasten wie in Hyprland (linux/.config/hypr/hyprland.lua)
#  Mod = Control+Option (⌃⌥) statt Super. Option allein geht nicht: mit
#  deutscher Belegung tippt man damit @ [ ] { } | ~ €. Ctrl aus Hyprland
#  (Fenster verschieben) wird hier ⌘:
#    Super+X → ⌃⌥X    Super+Ctrl+X → ⌃⌥⌘X
#    Super+Shift+X → ⌃⌥⇧X    Super+Ctrl+Shift+X → ⌃⌥⌘⇧X
#  ⌃⌥ liegt auf Caps Lock (Karabiner, ~/.config/karabiner): Caps+1, Caps+⌘1 …
#
#  Was macOS oder Raycast selbst übernimmt (keine Bindung hier):
#    Starter, Zwischenablage-Verlauf   Raycast (⌥Space, in Raycast einstellen)
#    Hell/Dunkel                       Systemeinstellungen → Erscheinungsbild „Automatisch“
#    Sperren                           ⌃⌘Q
#    Fensterwechsel                    ⌘Tab
#    Lautstärke, Helligkeit, Medien    Funktionstasten
# ============================================================

config-version = 2

# Rahmen ums aktive Fenster (JankyBorders, Farben von matugen:
# ~/.config/borders/bordersrc, theme.sh lädt sie neu)
after-startup-command = ['exec-and-forget borders']

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# 'auto': breiter Monitor → nebeneinander, hoher → untereinander
default-root-container-orientation = 'auto'

# Maus springt mit, wenn der Fokus auf einen anderen Monitor wechselt
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Arbeitsflächen I–IX (Mod+1 … Mod+9) wie in Hyprland; I–V bleiben auch leer bestehen
persistent-workspaces = ["I", "II", "III", "IV", "V"]

# Programme aus exec-and-forget finden Homebrew und cargo (emacsclient, matugen …)
[exec]
    inherit-env-vars = true
[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.cargo/bin:${HOME}/.local/bin:${PATH}'

# Tasten nach Lage (QWERTY), nicht nach Sprache: Mod+H bleibt Mod+H auch
# mit russischer oder deutscher Belegung. Auf deutscher Tastatur deshalb:
# minus = ß, equal = ´, slash = -, leftSquareBracket = Ü, rightSquareBracket = +,
# semicolon = Ö
[key-mapping]
    preset = 'qwerty'

# Wie Hyprland: 8 zwischen Fenstern, 8 zum Rand
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.top        = 8
    outer.right      = 8

# ─── Haupttasten ──────────────────────────────────────────────────────────────
[mode.main.binding]

    # Programme
    # Ghostty läuft schon: nur ein neues Fenster (AppleScript, ab 1.3) statt
    # mit `open -na` jedes Mal eine ganze neue Ghostty-Instanz zu starten
    ctrl-alt-t = '''exec-and-forget osascript -e 'if application "Ghostty" is running then
tell application "Ghostty" to new window
end if
tell application "Ghostty" to activate' '''
    ctrl-alt-n = "exec-and-forget emacsclient -c -a ''"

    ctrl-alt-q = 'close'

    # Fokus
    ctrl-alt-h     = 'focus left'
    ctrl-alt-j     = 'focus down'
    ctrl-alt-k     = 'focus up'
    ctrl-alt-l     = 'focus right'
    ctrl-alt-left  = 'focus left'
    ctrl-alt-down  = 'focus down'
    ctrl-alt-up    = 'focus up'
    ctrl-alt-right = 'focus right'

    # Fenster verschieben
    ctrl-alt-cmd-h     = 'move left'
    ctrl-alt-cmd-j     = 'move down'
    ctrl-alt-cmd-k     = 'move up'
    ctrl-alt-cmd-l     = 'move right'
    ctrl-alt-cmd-left  = 'move left'
    ctrl-alt-cmd-down  = 'move down'
    ctrl-alt-cmd-up    = 'move up'
    ctrl-alt-cmd-right = 'move right'

    # Fokus auf anderen Monitor
    ctrl-alt-shift-h     = 'focus-monitor left'
    ctrl-alt-shift-j     = 'focus-monitor down'
    ctrl-alt-shift-k     = 'focus-monitor up'
    ctrl-alt-shift-l     = 'focus-monitor right'
    ctrl-alt-shift-left  = 'focus-monitor left'
    ctrl-alt-shift-down  = 'focus-monitor down'
    ctrl-alt-shift-up    = 'focus-monitor up'
    ctrl-alt-shift-right = 'focus-monitor right'

    # Fenster auf anderen Monitor
    ctrl-alt-cmd-shift-h     = 'move-node-to-monitor --focus-follows-window left'
    ctrl-alt-cmd-shift-j     = 'move-node-to-monitor --focus-follows-window down'
    ctrl-alt-cmd-shift-k     = 'move-node-to-monitor --focus-follows-window up'
    ctrl-alt-cmd-shift-l     = 'move-node-to-monitor --focus-follows-window right'
    ctrl-alt-cmd-shift-left  = 'move-node-to-monitor --focus-follows-window left'
    ctrl-alt-cmd-shift-down  = 'move-node-to-monitor --focus-follows-window down'
    ctrl-alt-cmd-shift-up    = 'move-node-to-monitor --focus-follows-window up'
    ctrl-alt-cmd-shift-right = 'move-node-to-monitor --focus-follows-window right'

    # Arbeitsfläche runter/hoch (U/I, Bild ab/auf)
    ctrl-alt-u        = 'workspace next'
    ctrl-alt-i        = 'workspace prev'
    ctrl-alt-pageDown = 'workspace next'
    ctrl-alt-pageUp   = 'workspace prev'
    ctrl-alt-cmd-u        = 'move-node-to-workspace --focus-follows-window next'
    ctrl-alt-cmd-i        = 'move-node-to-workspace --focus-follows-window prev'
    ctrl-alt-cmd-pageDown = 'move-node-to-workspace --focus-follows-window next'
    ctrl-alt-cmd-pageUp   = 'move-node-to-workspace --focus-follows-window prev'

    # Arbeitsfläche wählen
    ctrl-alt-1 = 'workspace I'
    ctrl-alt-2 = 'workspace II'
    ctrl-alt-3 = 'workspace III'
    ctrl-alt-4 = 'workspace IV'
    ctrl-alt-5 = 'workspace V'
    ctrl-alt-6 = 'workspace VI'
    ctrl-alt-7 = 'workspace VII'
    ctrl-alt-8 = 'workspace VIII'
    ctrl-alt-9 = 'workspace IX'

    # Fenster auf Arbeitsfläche
    ctrl-alt-cmd-1 = 'move-node-to-workspace --focus-follows-window I'
    ctrl-alt-cmd-2 = 'move-node-to-workspace --focus-follows-window II'
    ctrl-alt-cmd-3 = 'move-node-to-workspace --focus-follows-window III'
    ctrl-alt-cmd-4 = 'move-node-to-workspace --focus-follows-window IV'
    ctrl-alt-cmd-5 = 'move-node-to-workspace --focus-follows-window V'
    ctrl-alt-cmd-6 = 'move-node-to-workspace --focus-follows-window VI'
    ctrl-alt-cmd-7 = 'move-node-to-workspace --focus-follows-window VII'
    ctrl-alt-cmd-8 = 'move-node-to-workspace --focus-follows-window VIII'
    ctrl-alt-cmd-9 = 'move-node-to-workspace --focus-follows-window IX'

    # Fenster mit dem Nachbarn zusammenfassen (consume-or-expel)
    ctrl-alt-leftSquareBracket  = 'join-with left'
    ctrl-alt-rightSquareBracket = 'join-with right'

    # Tabs (toggle-column-tabbed-display) → Akkordeon
    ctrl-alt-w = 'layout accordion tiles'
    # Teilungsrichtung umschalten
    ctrl-alt-slash = 'layout horizontal vertical'

    # Maximieren bzw. echtes macOS-Vollbild
    ctrl-alt-f      = 'fullscreen'
    ctrl-alt-m      = 'fullscreen'
    ctrl-alt-cmd-f = 'fullscreen'
    ctrl-alt-shift-f = 'macos-native-fullscreen'

    # Alle Fenster gleichmäßig aufteilen
    ctrl-alt-e      = 'balance-sizes'
    ctrl-alt-cmd-r = 'balance-sizes'

    # Größe: Breite (−/=), Höhe (Shift)
    ctrl-alt-minus       = 'resize width -100'
    ctrl-alt-equal       = 'resize width +100'
    ctrl-alt-shift-minus = 'resize height -100'
    ctrl-alt-shift-equal = 'resize height +100'

    # Schwebend ↔ gekachelt
    ctrl-alt-v = 'layout floating tiling'

    # Bildschirmfoto: Bereich wählen → Zwischenablage
    ctrl-alt-shift-s = 'exec-and-forget screencapture -ic'

    # Service-Modus
    ctrl-alt-shift-semicolon = 'mode service'

# ─── Service-Modus ────────────────────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']   # Layout zurücksetzen
    f         = ['layout floating tiling', 'mode main']   # schwebend/gekachelt
    backspace = ['close-all-windows-but-current', 'mode main']

    ctrl-alt-cmd-h = ['join-with left',  'mode main']
    ctrl-alt-cmd-j = ['join-with down',  'mode main']
    ctrl-alt-cmd-k = ['join-with up',    'mode main']
    ctrl-alt-cmd-l = ['join-with right', 'mode main']

# ─── Regeln für neue Fenster ──────────────────────────────────────────────────
# Keine Zuordnung zu Arbeitsflächen: neue Fenster öffnen dort, wo man gerade
# ist (wie Hyprland). Dialoge schweben von selbst (AeroSpace-Standard).

# Maclock – schwebend
[[on-window-detected]]
if.app-name-regex-substring = 'Maclock'
run = 'layout floating'

# Raycast-Fenster (Einstellungen usw.) nicht kacheln
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# Shottr (Screenshot-Vorschau, Overlay) nicht kacheln
[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = 'layout floating'
