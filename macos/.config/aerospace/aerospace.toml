# ============================================================
#  AeroSpace – Tasten wie in Hyprland (linux/.config/hypr/hyprland.lua)
#  Mod = ⌘ statt Super. ⌥ bleibt frei zum Schreiben (~ @ [ ] { } | €).
#
#  Was macOS oder Raycast selbst übernimmt (keine Bindung hier):
#    Starter, Zwischenablage-Verlauf   Raycast (⌘Space statt Spotlight; ⌥Space tippt ein geschütztes Leerzeichen)
#    Hell/Dunkel                       Systemeinstellungen → Erscheinungsbild „Automatisch“
#    Sperren                           ⌃⌘Q
#    Fensterwechsel                    ⌘Tab
#    Bildschirmfoto                    ⌘⇧4 bzw. ⌘⌃⇧4 (in die Zwischenablage)
#    Lautstärke, Helligkeit, Medien    Funktionstasten
# ============================================================

config-version = 2

# Rahmen ums aktive Fenster (JankyBorders, Farben von matugen:
# ~/.config/borders/bordersrc, theme.sh lädt sie neu)
after-startup-command = ['exec-and-forget borders']

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# 'auto': breiter Monitor → nebeneinander, hoher → untereinander
default-root-container-orientation = 'auto'

# Maus springt mit, wenn der Fokus auf einen anderen Monitor wechselt
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Arbeitsflächen I–IX (Mod+1 … Mod+9) wie in Hyprland; I–V bleiben auch leer bestehen
persistent-workspaces = ["I", "II", "III", "IV", "V"]

# Programme aus exec-and-forget finden Homebrew und cargo (emacsclient, matugen …)
[exec]
    inherit-env-vars = true
[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.cargo/bin:${HOME}/.local/bin:${PATH}'

# Tasten nach Lage (QWERTY), nicht nach Sprache: Mod+H bleibt Mod+H auch
# mit russischer oder deutscher Belegung
[key-mapping]
    preset = 'qwerty'

# Wie Hyprland: 8 zwischen Fenstern, 8 zum Rand
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.top        = 8
    outer.right      = 8

# ─── Haupttasten ──────────────────────────────────────────────────────────────
# Mod = ⌘ (wie Super). ⌘ mit Tasten, die beim Schreiben gebraucht werden,
# bleibt bei macOS: ⌘C/V/X/Z/A/S/F/W/T/N, ⌘U/I/B, ⌘←/→, ⌘−/=, ⌘[ ], ⌘/.
# Seltenes liegt auf ⌘⌃.
[mode.main.binding]

    # Programme
    cmd-enter = 'exec-and-forget open -na Ghostty'

    cmd-q = 'close'

    # Fokus
    cmd-h = 'focus left'
    cmd-j = 'focus down'
    cmd-k = 'focus up'
    cmd-l = 'focus right'

    # Fenster verschieben
    cmd-ctrl-h     = 'move left'
    cmd-ctrl-j     = 'move down'
    cmd-ctrl-k     = 'move up'
    cmd-ctrl-l     = 'move right'
    cmd-ctrl-left  = 'move left'
    cmd-ctrl-down  = 'move down'
    cmd-ctrl-up    = 'move up'
    cmd-ctrl-right = 'move right'

    # Fokus auf anderen Monitor
    cmd-shift-h = 'focus-monitor left'
    cmd-shift-j = 'focus-monitor down'
    cmd-shift-k = 'focus-monitor up'
    cmd-shift-l = 'focus-monitor right'

    # Fenster auf anderen Monitor
    cmd-ctrl-shift-h = 'move-node-to-monitor --focus-follows-window left'
    cmd-ctrl-shift-j = 'move-node-to-monitor --focus-follows-window down'
    cmd-ctrl-shift-k = 'move-node-to-monitor --focus-follows-window up'
    cmd-ctrl-shift-l = 'move-node-to-monitor --focus-follows-window right'

    # Arbeitsfläche runter/hoch (Bild ab/auf)
    cmd-pageDown = 'workspace next'
    cmd-pageUp   = 'workspace prev'
    cmd-ctrl-u        = 'move-node-to-workspace --focus-follows-window next'
    cmd-ctrl-i        = 'move-node-to-workspace --focus-follows-window prev'
    cmd-ctrl-pageDown = 'move-node-to-workspace --focus-follows-window next'
    cmd-ctrl-pageUp   = 'move-node-to-workspace --focus-follows-window prev'

    # Arbeitsfläche wählen
    cmd-1 = 'workspace I'
    cmd-2 = 'workspace II'
    cmd-3 = 'workspace III'
    cmd-4 = 'workspace IV'
    cmd-5 = 'workspace V'
    cmd-6 = 'workspace VI'
    cmd-7 = 'workspace VII'
    cmd-8 = 'workspace VIII'
    cmd-9 = 'workspace IX'

    # Fenster auf Arbeitsfläche
    cmd-ctrl-1 = 'move-node-to-workspace I'
    cmd-ctrl-2 = 'move-node-to-workspace II'
    cmd-ctrl-3 = 'move-node-to-workspace III'
    cmd-ctrl-4 = 'move-node-to-workspace IV'
    cmd-ctrl-5 = 'move-node-to-workspace V'
    cmd-ctrl-6 = 'move-node-to-workspace VI'
    cmd-ctrl-7 = 'move-node-to-workspace VII'
    cmd-ctrl-8 = 'move-node-to-workspace VIII'
    cmd-ctrl-9 = 'move-node-to-workspace IX'

    # Fenster mit dem Nachbarn zusammenfassen (consume-or-expel)
    cmd-ctrl-leftSquareBracket  = 'join-with left'
    cmd-ctrl-rightSquareBracket = 'join-with right'

    # Tabs (toggle-column-tabbed-display) → Akkordeon
    cmd-ctrl-w = 'layout accordion tiles'
    # Teilungsrichtung umschalten
    cmd-ctrl-slash = 'layout horizontal vertical'

    # Maximieren
    cmd-m      = 'fullscreen'
    cmd-ctrl-f = 'fullscreen'

    # Alle Fenster gleichmäßig aufteilen
    cmd-ctrl-r = 'balance-sizes'

    # Größe: Breite (−/=), Höhe (Shift)
    cmd-ctrl-minus       = 'resize width -100'
    cmd-ctrl-equal       = 'resize width +100'
    cmd-ctrl-shift-minus = 'resize height -100'
    cmd-ctrl-shift-equal = 'resize height +100'

    # Schwebend ↔ gekachelt
    cmd-ctrl-v = 'layout floating tiling'

    # Service-Modus
    cmd-shift-semicolon = 'mode service'

# ─── Service-Modus ────────────────────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']   # Layout zurücksetzen
    f         = ['layout floating tiling', 'mode main']   # schwebend/gekachelt
    backspace = ['close-all-windows-but-current', 'mode main']

    h = ['join-with left',  'mode main']
    j = ['join-with down',  'mode main']
    k = ['join-with up',    'mode main']
    l = ['join-with right', 'mode main']

# ─── Regeln für neue Fenster ──────────────────────────────────────────────────
# Keine Zuordnung zu Arbeitsflächen: neue Fenster öffnen dort, wo man gerade
# ist (wie Hyprland). Dialoge schweben von selbst (AeroSpace-Standard).

# Maclock – schwebend
[[on-window-detected]]
if.app-name-regex-substring = 'Maclock'
run = 'layout floating'

# Raycast-Fenster (Einstellungen usw.) nicht kacheln
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'
