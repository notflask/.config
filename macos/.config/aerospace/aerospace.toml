# Config version for compatibility and deprecations
config-version = 2

# Commands that run after AeroSpace startup
after-startup-command = []

# Start AeroSpace at login
start-at-login = false

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion padding
accordion-padding = 30

# Default layout
default-root-container-layout = 'tiles'

# 'auto': wide monitor → horizontal, tall monitor → vertical
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Don't auto-hide macOS apps
automatically-unhide-macos-hidden-apps = false

# Persistent workspaces (stay alive even when empty)
persistent-workspaces = ["BROWSER", "DEV", "MSG", "NOTES", "TRADING", "RECORDING", "MISC"]

on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 10
    inner.vertical   = 10
    outer.left       = 10
    outer.bottom     = 10
    outer.top        = 10
    outer.right      = 10

# ─── Main bindings ────────────────────────────────────────────────────────────
[mode.main.binding]

    # Layout toggles
    ctrl-slash = 'layout tiles horizontal vertical'
    ctrl-comma = 'layout accordion horizontal vertical'

    # Focus
    ctrl-h = 'focus left'
    ctrl-j = 'focus down'
    ctrl-k = 'focus up'
    ctrl-l = 'focus right'

    # Move windows
    ctrl-shift-h = 'move left'
    ctrl-shift-j = 'move down'
    ctrl-shift-k = 'move up'
    ctrl-shift-l = 'move right'

    # Resize
    ctrl-minus = 'resize smart -50'
    ctrl-equal = 'resize smart +50'

    # Switch workspace
    ctrl-1 = 'workspace BROWSER'
    ctrl-2 = 'workspace DEV'
    ctrl-3 = 'workspace MSG'
    ctrl-4 = 'workspace NOTES'
    ctrl-5 = 'workspace TRADING'
    ctrl-6 = 'workspace RECORDING'
    ctrl-7 = 'workspace MISC'

    # Move window to workspace
    ctrl-shift-1 = 'move-node-to-workspace BROWSER'
    ctrl-shift-2 = 'move-node-to-workspace DEV'
    ctrl-shift-3 = 'move-node-to-workspace MSG'
    ctrl-shift-4 = 'move-node-to-workspace NOTES'
    ctrl-shift-5 = 'move-node-to-workspace TRADING'
    ctrl-shift-6 = 'move-node-to-workspace RECORDING'
    ctrl-shift-7 = 'move-node-to-workspace MISC'

    # Navigate back and forth
    ctrl-tab       = 'workspace-back-and-forth'
    ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Enter service mode
    ctrl-shift-semicolon = 'mode service'

# ─── Service mode bindings ────────────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']   # reset layout
    f         = ['layout floating tiling', 'mode main']   # toggle float/tile
    backspace = ['close-all-windows-but-current', 'mode main']

    ctrl-shift-h = ['join-with left',  'mode main']
    ctrl-shift-j = ['join-with down',  'mode main']
    ctrl-shift-k = ['join-with up',    'mode main']
    ctrl-shift-l = ['join-with right', 'mode main']

# ─── Window detection rules ───────────────────────────────────────────────────
# ВАЖНО: первый блок без условий применяется ко всем окнам.
# check-further-callbacks = true позволяет продолжить обработку
# и сработать следующим правилам с конкретными app-id.

[[on-window-detected]]
check-further-callbacks = true
run = 'layout tiling'

# Maclock — floating, дальше не идём
[[on-window-detected]]
if.app-name-regex-substring = 'Maclock'
run = 'layout floating'

# BROWSER
[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = ['move-node-to-workspace BROWSER', 'workspace BROWSER']

# DEV
[[on-window-detected]]
if.app-id = 'com.jetbrains.clion'
run = ['move-node-to-workspace DEV', 'workspace DEV']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace DEV', 'workspace DEV']

# MSG
[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['move-node-to-workspace MSG', 'workspace MSG']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace MSG', 'workspace MSG']

[[on-window-detected]]
if.app-id = 'dev.vencord.vesktop'
run = ['move-node-to-workspace MSG', 'workspace MSG']

# NOTES
[[on-window-detected]]
if.app-name-regex-substring = 'Notion'
run = ['move-node-to-workspace NOTES', 'workspace NOTES']

[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian'
run = ['move-node-to-workspace NOTES', 'workspace NOTES']

# TRADING
[[on-window-detected]]
if.app-id = 'com.tradingview.tradingviewapp.desktop'
run = ['move-node-to-workspace TRADING', 'workspace TRADING']

# RECORDING
[[on-window-detected]]
if.app-name-regex-substring = 'OBS'
run = ['move-node-to-workspace RECORDING', 'workspace RECORDING']
