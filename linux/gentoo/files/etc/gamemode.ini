; GameMode – gilt für gaming-mode und
; gamemoderun. Prozess-Priorität erlaubt die Gruppe gamemode (setup.sh).
[general]
; renice 5 statt 10: Bei 10 verdrängt das Spiel den Encoder von Discord →
; der Discord-Stream ruckelt, egal welche Qualität
renice=5

[custom]
; Lüfter früh hochdrehen: CPU und RTX 4060 halten so länger hohe Takte,
; statt am Limit zu drosseln. Ab 85 °C 100 %, ab 90 °C erzwingt das Control
; Center ohnehin 100 %. Nach dem Spiel zurück auf Automatik.
start=/usr/bin/gbcc fan curve 50:25,60:40,70:60,78:80,85:100
end=/usr/bin/gbcc fan auto
