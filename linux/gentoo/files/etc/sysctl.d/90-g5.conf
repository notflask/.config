# Kernel-Tuning für Spiele und Netz.
# Gilt ab dem Booten (systemd lädt /etc/sysctl.d), sofort: sudo sysctl --system

# ── Split-Lock-Bremse aus (wie SteamOS) ──
# Der Kernel bremst sonst Programme mit Split-Locks absichtlich aus – einige
# Windows-Spiele ruckeln dadurch stark.
kernel.split_lock_mitigate = 0

# ── Viele Speicherbereiche pro Programm (wie SteamOS) ──
# Der Kernel-Standard ist 65530: einige Spiele (Proton, CS2, Star
# Citizen, Hogwarts Legacy) stürzen damit ab oder laden ewig.
vm.max_map_count = 1048576

# ── Speicher: keine Hänger unter Last ──
# zram ist komprimierter RAM, kein langsamer Datenträger: lieber früh dorthin
# auslagern als den Cache von Spiel und Browser zu verwerfen (ArchWiki)
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Nicht im Hintergrund RAM umsortieren – kostet unregelmäßig CPU mitten im Spiel
vm.compaction_proactiveness = 0
# Geänderte Daten spätestens ab 256 MB wegschreiben statt ab 20 % des RAM:
# Steam-Downloads und Shader-Caches erzeugen sonst große Schreibschübe
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# Kein NMI-Watchdog (Watchdogs aus wie CachyOS, siehe modprobe.d/g5.conf)
kernel.nmi_watchdog = 0

# ── TCP: BBR statt CUBIC ──
# Hält die Warteschlange im Router klein → kein Ping-Anstieg bei Downloads
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 131072
# Im WireGuard-Tunnel (MTU 1280, siehe vpn import) hängen Verbindungen sonst, wenn ICMP
# „Fragmentation needed“ unterwegs verloren geht
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3
# Größere Puffer für schnelle Downloads über ~40 ms VPN-Latenz
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Antworten aus dem Tunnel nicht verwerfen
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
