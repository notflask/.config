# Kernel und Kernel-Module: viele kleine C-Dateien, wenig RAM pro Job →
# alle 16 Threads statt der allgemeinen -j7 (die gelten für LLVM, Rust, Qt
# mit ~2 GB pro Job). ccache: gleiche/ähnliche Versionen neu bauen geht dann
# 3–10× schneller (Config-Änderung, Punkt-Update, Modul-Neubau).
MAKEOPTS="-j16 -l16"
FEATURES="${FEATURES} ccache"
CCACHE_DIR="/var/cache/ccache"
