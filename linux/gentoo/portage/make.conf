# /etc/portage/make.conf – Gentoo auf dem G5 (i5-12500H + RTX 4060)
# Vorlage aus linux/gentoo/portage/make.conf; configure.sh ersetzt @MAKEOPTS@.
# Nach Änderungen: emerge -uDN @world

# ── Compiler ───────────────────────────────────────────────
# -march=native für alles, was lokal gebaut wird. Die Binärpakete vom
# Gentoo-Binhost (x86-64-v3, siehe binrepos.conf) bleiben davon unberührt:
# Portage nimmt sie, wenn die USE-Flags passen, sonst wird gebaut.
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"
# Bauen: Kerne/Threads und RAM (configure.sh rechnet das aus)
MAKEOPTS="@MAKEOPTS@"
# Zwei Pakete gleichzeitig, aber nicht mehr Last als Threads
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=@THREADS@ --keep-going=y --quiet-build=y --with-bdeps=y --verbose-conflicts --binpkg-respect-use=y --usepkg-exclude='sys-kernel/gentoo-kernel x11-drivers/nvidia-drivers app-laptop/tuxedo-drivers'"
# Kernel und Kernel-Module nie vom Binhost: das Binärpaket ist mit der
# Standard-Config gebaut (300 Hz) und ignoriert /etc/kernel/config.d/g5.config

# ── Portage ────────────────────────────────────────────────
# getbinpkg: Binärpakete vom offiziellen Binhost (Firefox, Qt, LLVM, Rust …),
# signiert (binpkg-request-signature). parallel-fetch lädt nebenbei.
FEATURES="getbinpkg binpkg-request-signature parallel-fetch"
# Nicht alles compilieren: 16 GB RAM, Build-Verzeichnis auf der Platte
PORTAGE_TMPDIR="/var/tmp"
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"
# Portage-Ausgabe: deutsch/englisch, Farben
GENTOO_MIRRORS="https://distfiles.gentoo.org"
# Binärpakete nicht lokal ablegen (Platz), Logs behalten
PORTAGE_ELOG_CLASSES="log warn error"
PORTAGE_ELOG_SYSTEM="save"

# Nur Abweichungen, die Binärpakete nicht ungültig machen
USE="dist-kernel"
