# Offizieller Gentoo-Binhost. Zuerst x86-64-v3 (AVX2, passt zum i5-12500H),
# dann der Basis-Satz, falls ein Paket dort noch fehlt. Signaturen prüft
# Portage (getuto legt die Schlüssel an).
[gentoo-x86-64-v3]
priority = 9999
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/
verify-signature = true
location = /var/cache/binhost/gentoo-x86-64-v3

[gentoo]
priority = 9959
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
verify-signature = true
location = /var/cache/binhost/gentoo
