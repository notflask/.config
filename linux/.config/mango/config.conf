# MangoWC – Fenstermanager unter Void Linux (linux/void, README dort)
#
# Wie dwm (Tags 1–9, Layouts zum Umschalten), dazu ein Scroll-Layout wie
# Niri. Stil anders als unter NixOS: ganz minimal – eckige Fenster, 1px
# Rahmen in der Akzentfarbe des Wallpapers, keine Effekte, keine
# Animationen, schmale Textleiste oben (quickshell/minibar).
# Tastenkürzel wie in niri/config.kdl, damit die Finger nichts umlernen müssen.
# Doku: https://mangowm.github.io/docs – Config prüfen: mango -p
# Neu laden: Super+Shift+C (oder `wm reload`)
#
# Start: greetd → mango-session (linux/void/bin) → mango. Umgebungsvariablen
# für die GPUs stehen dort, nicht hier: env= gilt erst nach dem Start des
# Backends und würde bei jedem Neuladen zurückgesetzt.

# ── Autostart ───────────────────────────────────────────────────────────
# Gleiche Liste wie unter Niri/Hyprland: Taskleiste, Hintergrund, Clipboard,
# EasyEffects … (unter MangoWC die Textleiste quickshell/minibar und
# mako im flachen Stil) – unter Void zusätzlich PipeWire, Polkit, KWallet, Auto-Sperre
# (die unter NixOS systemd startet). Steht in `wm autostart` (wm.sh).
exec-once=wm autostart

# ── Monitore ────────────────────────────────────────────────────────────
# primary: X11-Spiele (Proton) öffnen sich auf dem LG
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:144.003,x:0,y:0,scale:1
# VRR (FreeSync/G-Sync) nur für Spiele im Vollbild (Fensterregeln unten)
monitorrule=name:^DP-2$,width:2560,height:1440,refresh:179.959,x:1920,y:0,scale:1,vrr:0,primary:1

# ── Eingabe ─────────────────────────────────────────────────────────────
xkb_rules_layout=us,ru,ua,de
xkb_rules_options=grp:alt_shift_toggle
numlockon=1
repeat_rate=25
repeat_delay=600
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
mouse_natural_scrolling=0
# Maus folgt dem Fokus nicht (wie Niri), Fokus folgt der Maus nicht
sloppyfocus=0
warpcursor=0
focus_on_activate=1

# macOS-Cursor (wie theme.nix; linux/void installiert ihn)
cursor_theme=macOS
cursor_size=24

# ── Gaming ──────────────────────────────────────────────────────────────
# drm_syncobj (explizite Synchronisation): ohne das ruckeln Spiele auf
# NVIDIA und Fenster flackern
syncobj_enable=1
# Tearing nur im Vollbild und nur, wenn das Spiel es will (VSync aus im
# Spiel). Kleinste Latenz, wie `immediate` unter Hyprland
allow_tearing=2
# Kein Auto-Sperren, solange ein Spiel/Video im Vollbild läuft
idleinhibit_when_fullscreen=1
xwayland_persistence=1

# ── Layouts ─────────────────────────────────────────────────────────────
# Standard: Scrollen wie in Niri (neue Fenster rechts daneben, halbe
# Breite). Super+N schaltet um: Kacheln wie dwm (tile), gleich große
# Fenster (fair), Spirale (dwindle), eins über allem (monocle)
tag_num=9
tagrule=id:*,layout_name:scroller
circle_layout=scroller,tile,fair,dwindle,monocle

scroller_structs=20
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667,1.0
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=1
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
edge_scroller_pointer_focus=1

new_is_master=0
default_mfact=0.5
default_nmaster=1
smartgaps=0
dwindle_preserve_split=1

# Übersicht (Super+O): alle Fenster aller Tags
overviewgappi=8
overviewgappo=40
enable_hotarea=0

# ── Aussehen: minimal ───────────────────────────────────────────────────
# Eckig, 1px Rahmen, gleichmäßige Abstände – das Wallpaper ist die Deko
gappih=10
gappiv=10
gappoh=12
gappov=12
borderpx=1
border_radius=0
no_border_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Keine Effekte: kein Blur, keine Schatten (spart auch GPU fürs Spielen)
blur=0
blur_layer=0
shadows=0
layer_shadows=0

# Keine Animationen: Fenster und Tags sind sofort da
animations=0
layer_animations=0

# ── Fensterregeln ───────────────────────────────────────────────────────
windowrule=isfloating:1,appid:firefox$,title:^Picture-in-Picture$
windowrule=isfloating:1,appid:^org\.telegram\.desktop$
windowrule=isfloating:1,appid:^discord$
windowrule=isfloating:1,appid:^com\.gabm\.satty$
windowrule=isfullscreen:1,appid:^gamescope$

# Passwort-Apps: schweben und beim Bildschirmteilen geschwärzt
windowrule=isfloating:1,shield_when_capture:1,appid:^io\.ente\.auth$
windowrule=isfloating:1,shield_when_capture:1,appid:^Bitwarden$

# Spiele (CS2, Dota 2, Steam-Spiele, gamescope, Roblox über Sober): VRR auf dem LG
# im Vollbild. Ohne Effekte gibt Mango ihre Bilder direkt an den Monitor
# (Direct Scanout)
windowrule=vrr_only_fullscreen:1,appid:^steam_app_
windowrule=vrr_only_fullscreen:1,appid:^cs2$
windowrule=vrr_only_fullscreen:1,appid:^dota2$
windowrule=vrr_only_fullscreen:1,appid:^gamescope$
windowrule=vrr_only_fullscreen:1,appid:^org\.vinegarhq\.Sober$
# Tearing (niedrigste Latenz, im Spiel VSync aus) für die schnellen Spiele,
# wie unter Hyprland. Proton-Spiele heißen steam_app_<Steam-ID>; die ID eines
# laufenden Spiels zeigt `mmsg get all-clients` (appid).
windowrule=force_tearing:1,appid:^cs2$
windowrule=force_tearing:1,appid:^dota2$
# Deadlock (Steam-ID 1422450) und ARC Raiders (1808500), beide über Proton
windowrule=force_tearing:1,appid:^steam_app_1422450$
windowrule=force_tearing:1,appid:^steam_app_1808500$
# Maus bleibt im Spiel, auch bei zwei Monitoren (Proton-Spiele)
windowrule=confine_pointer:1,appid:^steam_app_
windowrule=confine_pointer:1,appid:^dota2$

# Gigabyte Control Center: Schnellmenü vom Tray-Symbol unten rechts über
# der Taskleiste (offsetx/offsety in % vom Mittelpunkt, 100 = Rand)
windowrule=isfloating:1,offsetx:100,offsety:100,appid:^gigabyte-control-center$,title:^Gigabyte Control Center Quick$

# Wegwerf-Terminal (Super+`): schwebt oben mittig
windowrule=isfloating:1,width:0.6,height:0.5,offsety:-100,appid:^com\.flask\.scratchpad$

# Terminal schluckt GUI-Programme, die daraus starten (wie dwm-swallow)
windowrule=isterm:1,appid:^com\.mitchellh\.ghostty$

# ── Ebenen (Leiste, Rofi, mako …) ───────────────────────────────────────
# beim Bildschirmteilen nicht mitsenden
layerrule=shield_when_capture:1,layer_name:^notifications$

# ── Tastenkürzel ────────────────────────────────────────────────────────
# Wie in Niri. Alle zeigen: Super+Shift+/ (`wm hotkeys`)
bind=SUPER+SHIFT,slash,spawn,wm hotkeys
bind=SUPER+SHIFT,c,reload_config

# Programme
bind=SUPER,t,spawn,term
bind=SUPER,grave,spawn,scratch-term
bind=SUPER,d,spawn,rofi -show drun -theme ~/.config/rofi/flat.rasi
bind=SUPER,space,spawn,rofi -show drun -theme ~/.config/rofi/flat.rasi
bind=SUPER+SHIFT,l,spawn,wm lock
bind=SUPER+CTRL,v,spawn,clipboard-history
bind=SUPER+SHIFT,e,spawn,power-menu
bind=SUPER+SHIFT,s,spawn,screenshot-edit
bind=NONE,Print,spawn,screenshot

# Lautstärke, Medien, Helligkeit – auch bei gesperrtem Bildschirm
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.01+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.01-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# Fenster
bind=SUPER,q,killclient
bind=SUPER,o,toggleoverview
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,v,togglefloating
bind=SUPER,c,centerwin
bind=SUPER,r,switch_proportion_preset
bind=SUPER,minus,resizewin,-100,0
bind=SUPER,equal,resizewin,+100,0
bind=SUPER+SHIFT,minus,resizewin,0,-100
bind=SUPER+SHIFT,equal,resizewin,0,+100
# Alt+Tab: Fenster aller Tags mit Vorschau, Loslassen wählt
bind=ALT,Tab,switcher,all_next
bind=ALT+SHIFT,Tab,switcher,all_prev

# Layout: Super+N weiter, Super+E alle Fenster gleich groß (wie
# niri-even-split), Super+W Tabs (monocle mit Tableiste)
bind=SUPER,n,switch_layout
bind=SUPER,e,setlayout,fair
bind=SUPER,w,setlayout,monocle
bind=SUPER,comma,scroller_stack,left
bind=SUPER,period,scroller_stack,right

# Fokus (Pfeile oder Vim-Tasten); oben/unten wechselt am Rand den Tag
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focus_window_or_workspace,up
bind=SUPER,Down,focus_window_or_workspace,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focus_window_or_workspace,up
bind=SUPER,j,focus_window_or_workspace,down

# Fenster verschieben
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down

# Monitore
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# Tags (wie Arbeitsflächen in Niri)
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
# dwm-Spezialität: mehrere Tags gleichzeitig ansehen bzw. ein Fenster auf
# mehreren Tags zeigen
bind=SUPER+ALT,1,toggleview,1
bind=SUPER+ALT,2,toggleview,2
bind=SUPER+ALT,3,toggleview,3
bind=SUPER+ALT,4,toggleview,4
bind=SUPER+ALT,5,toggleview,5
bind=SUPER+ALT,6,toggleview,6
bind=SUPER+ALT,7,toggleview,7
bind=SUPER+ALT,8,toggleview,8
bind=SUPER+ALT,9,toggleview,9
bind=SUPER,g,toggleglobal

# Maus: Super+Ziehen bewegt, Super+Rechtsziehen ändert die Größe
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# Touchpad: 3 Finger Fokus, 4 Finger Tags und Übersicht
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Farben aus dem Hintergrundbild (matugen, ~/.config/matugen/theme.sh).
# Am Ende, damit sie die Werte oben überschreiben.
source-optional=~/.config/mango/colors.conf
