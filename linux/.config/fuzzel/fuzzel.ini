# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
# Stil: macOS Spotlight / Liquid Glass – klein, rund, durchsichtig
[main]
font=Inter:size=12,JetBrainsMono Nerd Font:size=12
prompt="󰍉  "
placeholder=Spotlight-Suche
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=no

anchor=top
y-margin=240
width=40
lines=6
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=28

[colors]
background=282a2f80
text=e1e2e9e6
prompt=c3c6cfff
placeholder=c3c6cf80
input=e1e2e9ff
match=e1e2e9ff
selection=a5c8ffb3
selection-text=00315eff
selection-match=00315eff
border=ffffff40

[border]
width=1
radius=40
selection-radius=14
