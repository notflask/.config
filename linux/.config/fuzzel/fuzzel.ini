# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
# Stil: macOS Spotlight (Tahoe) – Glas, neutrale Auswahl, große Icons
[main]
# Nerd Font nur für die Lupe – größer, damit sie wie in Spotlight wirkt
font=Inter:size=14,JetBrainsMono Nerd Font:size=18
# Schrift nicht nach Monitor-DPI skalieren (sonst riesig auf eDP-1)
dpi-aware=no
# dünne Lupe wie in Spotlight, eingerückt wie dort
prompt="   "
placeholder=Spotlight-Suche
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=no

anchor=top
y-margin=240
width=50
lines=6
horizontal-pad=16
# Fuzzel rundet höchstens so stark wie vertical-pad → radius nicht größer machen
vertical-pad=26
inner-pad=10
# hohe Zeilen = große Icons und Luft wie in Spotlight
line-height=40

[colors]
background=29292f80
text=e4e1e9e6
prompt=c7c5d0cc
placeholder=c7c5d080
input=e4e1e9ff
match=e4e1e9ff
# neutrale Glas-Auswahl statt Akzentfarbe, Schrift bleibt hell
selection=e4e1e929
selection-text=e4e1e9ff
selection-match=e4e1e9ff
border=ffffff40

[border]
width=1
# gleich wie geometry-corner-radius in niri/config.kdl (Blur-Ausschnitt)
radius=26
selection-radius=12
