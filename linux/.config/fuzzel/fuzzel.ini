# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
# Stil: macOS Spotlight / Liquid Glass – klein, rund, durchsichtig
[main]
font=Inter:size=13.6,JetBrainsMono Nerd Font:size=13.6
# Schrift nicht nach Monitor-DPI skalieren (sonst riesig auf eDP-1)
dpi-aware=no
prompt="󰍉  "
placeholder=Spotlight-Suche
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=no

anchor=top
y-margin=240
width=40
lines=6
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=32

[colors]
background=29292f80
text=e4e1e9e6
prompt=c7c5d0ff
placeholder=c7c5d080
input=e4e1e9ff
match=e4e1e9ff
selection=bbc3ffb3
selection-text=232c61ff
selection-match=232c61ff
border=ffffff40

[border]
width=1
radius=40
selection-radius=14
