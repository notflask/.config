# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
[main]
font=Inter:size=13,JetBrainsMono Nerd Font:size=13
prompt="  "
placeholder=Suchen…
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=yes

width=36
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=16
line-height=36
image-size-ratio=0

[colors]
background=1d2024d9
text=e1e2e9ff
prompt=a5c8ffff
placeholder=c3c6cf99
input=e1e2e9ff
match=a5c8ffff
selection=214876ff
selection-text=d4e3ffff
selection-match=d4e3ffff
counter=8d9199ff
border=43474eff

[border]
width=1
radius=20
selection-radius=12
