# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
# Stil: macOS Spotlight – breite Leiste im oberen Drittel
[main]
font=Inter:size=14,JetBrainsMono Nerd Font:size=14
prompt="󰍉  "
placeholder=Spotlight-Suche
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=no

anchor=top
y-margin=240
width=52
lines=7
horizontal-pad=18
vertical-pad=14
inner-pad=12
line-height=34

[colors]
background=282a2fc7
text=e1e2e9e6
prompt=c3c6cfff
placeholder=c3c6cf80
input=e1e2e9ff
match=e1e2e9ff
selection=a5c8ffd9
selection-text=00315eff
selection-match=00315eff
border=e1e2e926

[border]
width=1
radius=26
selection-radius=10
