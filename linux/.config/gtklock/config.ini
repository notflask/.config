; gtklock – Sperrbildschirm unter Void Linux (hyprlock gibt es dort nicht).
; Start: `wm lock` (Super+Shift+L, Ausschalt-Menü, swayidle). Hintergrund ist
; das Wallpaper (theme.sh legt eine verkleinerte Kopie an), Aussehen in
; style.css – die erzeugt matugen (templates/gtklock.css).
[main]
time-format=%H:%M
date-format=%A, %d. %B
follow-focus=true
idle-hide=true
idle-timeout=15
