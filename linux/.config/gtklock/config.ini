# gtklock – Sperrbildschirm.
# Start: `wm lock` (Super+Shift+L, Ausschalt-Menü, swayidle). Hintergrund ist
# das Wallpaper (theme.sh legt eine verkleinerte Kopie an), Anordnung in
# layout.ui (`wm lock` übergibt sie), Aussehen in style.css – die erzeugt
# matugen (templates/gtklock.css). Kommentare nur mit „#“: Mit „;“
# verwirft GKeyFile die ganze Datei.
[main]
time-format=%H:%M
date-format=%^A  ·  %d. %^B
follow-focus=true
idle-hide=true
idle-timeout=15
