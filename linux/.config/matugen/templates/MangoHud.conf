# Erzeugt von matugen (templates/MangoHud.conf) – hier nichts ändern.
# MangoHud für gaming-mode: Shift rechts + F12 blendet ein/aus,
# Shift rechts + F9 setzt Durchschnitt und 1%-Low zurück.
# Farben aus dem Hintergrundbild, Ampel: rot / gelb / grün.

## Aussehen: kompakte dunkle Glas-Tabelle oben links. Immer dunkel mit
## heller Schrift, unabhängig vom Hell-/Dunkelmodus: sie liegt über dem
## Spiel, nicht über dem Desktop (dunkle Schrift auf dunklem Spiel ging unter).
legacy_layout=false
position=top-left
offset_x=12
offset_y=12
round_corners=12
background_alpha=0.6
background_color=0b0b10
font_size=16
no_small_font
text_color=f2f2f6
text_outline
text_outline_color=000000
text_outline_thickness=1
table_columns=3
cellpadding_y=0.2

## Bildrate: Farbe nach FPS, dazu Durchschnitt und 1%-Low
fps
fps_color_change
fps_value=60,120
fps_color=ffb4ab,f0c674,8fd19e
fps_metrics=avg,0.01
frametime
frame_timing
frametime_color={{colors.primary_fixed_dim.default.hex_stripped}}

## Grafikkarte
gpu_text=RTX 4060
gpu_color={{colors.primary_fixed_dim.default.hex_stripped}}
gpu_stats
gpu_load_change
gpu_load_value=60,90
gpu_load_color=8fd19e,f0c674,ffb4ab
gpu_temp
vram
vram_color={{colors.tertiary_fixed_dim.default.hex_stripped}}

## Prozessor
cpu_text=i5-12500H
cpu_color={{colors.secondary_fixed_dim.default.hex_stripped}}
cpu_stats
cpu_load_change
cpu_load_value=60,90
cpu_load_color=8fd19e,f0c674,ffb4ab
cpu_temp
ram
ram_color={{colors.tertiary_fixed_dim.default.hex_stripped}}

## Kontrolle: drosselt etwas? läuft GameMode?
throttling_status
gamemode

toggle_hud=Shift_R+F12
