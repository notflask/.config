# Erzeugt von matugen (templates/hyprlock-colors.conf) – hier nichts ändern.
# Wird von hyprlock.conf eingebunden (source). Liquid Glass wie die Taskleiste
# (matugen/templates/glass.css): dunkles bzw. helles Glas je nach Modus (theme.sh).
$lock_background = rgb({{colors.surface.default.hex_stripped}})
<* if {{ is_dark_mode }} *>
# Glasfläche, Lichtkante (oben links hell, unten rechts fast weg), Schatten
$lock_glass = rgba(ffffff17)
$lock_rim = rgba(ffffff80) rgba(ffffff0f) rgba(ffffff0f) rgba(ffffff40) 135deg
$lock_shadow = rgba(00000073)
# Schrift auf dem Glas
$lock_text = rgba(f5f5f7ff)
# Feststelltaste: bernstein (wie die VPN-Warnung in der Taskleiste)
$lock_warn = rgb(f0c674)
<* else *>
$lock_glass = rgba(ffffff59)
$lock_rim = rgba(ffffffe6) rgba(ffffff33) rgba(ffffff99) 135deg
$lock_shadow = rgba(00000033)
$lock_text = rgba(15151aff)
$lock_warn = rgb(9a6700)
<* endif *>
# Direkt auf dem Bild (Uhr, Datum, Musik): immer hell auf leichtem Schleier,
# unabhängig vom Modus – das Bild bleibt ja dasselbe
$lock_tint = rgba(00000033)
$lock_clock = rgba(f5f5f7ff)
$lock_clock_dim = rgba(f5f5f7bf)
$lock_clock_shadow = rgba(00000080)
# Akzente aus dem Hintergrundbild: prüfen, Fehler
$lock_accent = rgb({{colors.primary.default.hex_stripped}})
$lock_error = rgb({{colors.error.default.hex_stripped}})
