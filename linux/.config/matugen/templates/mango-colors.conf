# Erzeugt von matugen (templates/mango-colors.conf) – hier nichts ändern.
# Wird am Ende von mango/config.conf eingebunden. Farben: 0xRRGGBBAA
rootcolor=0x{{colors.surface.default.hex_stripped}}ff
# 1px Glaskante: aktiv in der Akzentfarbe, inaktiv hell auf dunkel bzw.
# dunkel auf hell (wie Niri/Hyprland)
focuscolor=0x{{colors.primary.default.hex_stripped}}99
bordercolor=<* if {{ is_dark_mode }} *>0xffffff26<* else *>0x0000001f<* endif *>
urgentcolor=0x{{colors.error.default.hex_stripped}}ff
maximizescreencolor=0x{{colors.primary.default.hex_stripped}}99
scratchpadcolor=0x{{colors.tertiary.default.hex_stripped}}99
globalcolor=0x{{colors.secondary.default.hex_stripped}}99
overlaycolor=0x{{colors.tertiary.default.hex_stripped}}99
dropcolor=0x{{colors.primary.default.hex_stripped}}55
splitcolor=0x{{colors.primary.default.hex_stripped}}ff

# Übersicht (Sprungmarken) und Tableiste (monocle)
jump_label_decorate_fg_color=0x{{colors.on_surface.default.hex_stripped}}ff
jump_label_decorate_bg_color=0x{{colors.surface_container_high.default.hex_stripped}}e6
jump_label_decorate_focus_fg_color=0x{{colors.on_primary.default.hex_stripped}}ff
jump_label_decorate_focus_bg_color=0x{{colors.primary.default.hex_stripped}}ff
jump_label_decorate_border_color=0x{{colors.outline.default.hex_stripped}}66
jump_label_decorate_font_desc=Inter Bold 14
group_bar_decorate_fg_color=0x{{colors.on_surface_variant.default.hex_stripped}}ff
group_bar_decorate_bg_color=0x{{colors.surface_container.default.hex_stripped}}cc
group_bar_decorate_focus_fg_color=0x{{colors.on_surface.default.hex_stripped}}ff
group_bar_decorate_focus_bg_color=0x{{colors.surface_container_high.default.hex_stripped}}ff
group_bar_decorate_border_color=0x{{colors.outline.default.hex_stripped}}44
group_bar_decorate_font_desc=Inter 11
group_bar_height=32
