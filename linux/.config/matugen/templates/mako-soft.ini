# Erzeugt von matugen (templates/mako-soft.ini) – hier nichts ändern
# Stil islands/frame (`wm autostart` startet mako damit): deckend, rund,
# weicher Rand – wie die Inseln der Leiste (quickshell/islands)
font=Inter 11
width=380
height=160
outer-margin=12
margin=0,0,10,0
padding=14,16
border-size=1
border-radius=18
icons=1
max-icon-size=48
icon-location=left
# Zuerst die von theme.sh umgefärbten Symbole, dann die normalen
icon-path=/home/flask/.cache/matugen/icons:/usr/share/icons/Papirus:/usr/share/icons/hicolor
default-timeout=5000
ignore-timeout=1
max-visible=5
layer=overlay
anchor=top-right

background-color=#{{colors.surface_container.default.hex_stripped}}
text-color=#{{colors.on_surface.default.hex_stripped}}
border-color=#{{colors.outline_variant.default.hex_stripped}}
progress-color=over #{{colors.primary_container.default.hex_stripped}}

format=<b>%s</b>\n<span color="#{{colors.on_surface_variant.default.hex_stripped}}">%b</span>

[urgency=low]
text-color=#{{colors.on_surface_variant.default.hex_stripped}}

[urgency=critical]
border-color=#{{colors.error.default.hex_stripped}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
