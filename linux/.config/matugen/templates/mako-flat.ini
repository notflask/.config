# Erzeugt von matugen (templates/mako-flat.ini) – hier nichts ändern
# Minimaler Stil (`wm autostart` startet mako damit):
# eckig, deckend, 1px Rahmen in der Akzentfarbe. Glas-Stil: config
font=JetBrains Mono 10
width=360
height=160
outer-margin=12
margin=0,0,8,0
padding=10,12
border-size=1
border-radius=0
icons=1
max-icon-size=40
icon-location=left
# Zuerst die von theme.sh umgefärbten Symbole, dann die normalen
icon-path=/home/flask/.cache/matugen/icons:/usr/share/icons/Papirus:/usr/share/icons/hicolor
default-timeout=5000
ignore-timeout=1
max-visible=5
layer=overlay
anchor=top-right

background-color=#{{colors.surface.default.hex_stripped}}
text-color=#{{colors.on_surface.default.hex_stripped}}
border-color=#{{colors.primary.default.hex_stripped}}
progress-color=over #{{colors.primary_container.default.hex_stripped}}

format=<b>%s</b>\n<span color="#{{colors.on_surface_variant.default.hex_stripped}}">%b</span>

[urgency=low]
border-color=#{{colors.outline.default.hex_stripped}}

[urgency=critical]
border-color=#{{colors.error.default.hex_stripped}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
