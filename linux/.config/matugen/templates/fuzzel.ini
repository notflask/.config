# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
[main]
font=Inter:size=13,JetBrainsMono Nerd Font:size=13
prompt="  "
placeholder=Suchen…
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=yes

width=36
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=16
line-height=36
image-size-ratio=0

[colors]
background={{colors.surface_container.default.hex_stripped}}d9
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.primary.default.hex_stripped}}ff
placeholder={{colors.on_surface_variant.default.hex_stripped}}99
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.primary_container.default.hex_stripped}}ff
selection-text={{colors.on_primary_container.default.hex_stripped}}ff
selection-match={{colors.on_primary_container.default.hex_stripped}}ff
counter={{colors.outline.default.hex_stripped}}ff
border={{colors.outline_variant.default.hex_stripped}}ff

[border]
width=1
radius=20
selection-radius=12
