# Erzeugt von matugen (templates/fuzzel.ini) – hier nichts ändern
# Stil: macOS Spotlight – breite Leiste im oberen Drittel
[main]
font=Inter:size=14,JetBrainsMono Nerd Font:size=14
prompt="󰍉  "
placeholder=Spotlight-Suche
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,keywords,categories
show-actions=no
terminal=ghostty -e
match-counter=no

anchor=top
y-margin=240
width=52
lines=7
horizontal-pad=18
vertical-pad=14
inner-pad=12
line-height=34
image-size-ratio=0

[colors]
background={{colors.surface_container_high.default.hex_stripped}}c7
text={{colors.on_surface.default.hex_stripped}}e6
prompt={{colors.on_surface_variant.default.hex_stripped}}ff
placeholder={{colors.on_surface_variant.default.hex_stripped}}80
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.on_surface.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}d9
selection-text={{colors.on_primary.default.hex_stripped}}ff
selection-match={{colors.on_primary.default.hex_stripped}}ff
border={{colors.on_surface.default.hex_stripped}}26

[border]
width=1
radius=26
selection-radius=10
