[main]
width=30
tabs=4
horizontal-pad=20
vertical-pad=20
inner-pad=10

show-actions=no
icon-theme=Yaru-dark
icons-enabled=yes
icon-size=64

line-height=20
fields=name,generic

[colors]
background={{colors.surface.default.hex_stripped}}99
text={{colors.on_surface.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}ff
selection-text={{colors.on_primary.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}ff

[border]
width=2
radius=16
