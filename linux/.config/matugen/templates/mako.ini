# Erzeugt von matugen (templates/mako.ini) – hier nichts ändern
font=Inter 11
width=380
height=160
margin=12
padding=14,16
outer-margin=8
border-size=2
border-radius=16
icons=1
max-icon-size=56
icon-location=left
default-timeout=5000
max-visible=5
layer=overlay
anchor=top-right

background-color=#{{colors.surface.default.hex_stripped}}e6
text-color=#{{colors.on_surface.default.hex_stripped}}
border-color=#{{colors.primary.default.hex_stripped}}
progress-color=over #{{colors.primary_container.default.hex_stripped}}

format=<b>%s</b>\n<span color="#{{colors.on_surface_variant.default.hex_stripped}}">%b</span>

[urgency=low]
border-color=#{{colors.outline.default.hex_stripped}}

[urgency=critical]
border-color=#{{colors.error.default.hex_stripped}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
