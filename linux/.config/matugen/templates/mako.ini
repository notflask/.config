# Erzeugt von matugen (templates/mako.ini) – hier nichts ändern
# Stil: Liquid Glass – halbdurchsichtig, Blur macht niri (layer-rule "notifications")
font=Inter 11
width=380
height=160
# Rand außerhalb der Fläche (10 wie der Waybar-Rand), innen nur unten Abstand
# zwischen den Nachrichten – sonst zeichnet niri den Rand mit weich
outer-margin=10
margin=0,0,10,0
padding=14,16
border-size=1
border-radius=20
icons=1
max-icon-size=56
icon-location=left
default-timeout=5000
# Manche Apps (z. B. niri-Screenshots) wollen "nie ausblenden" – ignorieren
ignore-timeout=1
max-visible=5
layer=overlay
anchor=top-right

background-color=#{{colors.surface.default.hex_stripped}}73
text-color=#{{colors.on_surface.default.hex_stripped}}
border-color=#ffffff30
progress-color=over #{{colors.primary_container.default.hex_stripped}}

format=<b>%s</b>\n<span color="#{{colors.on_surface_variant.default.hex_stripped}}">%b</span>

[urgency=low]
border-color=#ffffff18

[urgency=critical]
border-color=#{{colors.error.default.hex_stripped}}
default-timeout=0

[mode=do-not-disturb]
invisible=1

# KDE-Absturzmelder: gamescope stürzt beim Beenden jedes Spiels ab (Mod+Q),
# harmlos – diese Meldungen ausblenden, andere Abstürze weiter anzeigen
[app-name=Absturz-Meldesystem body~=gamescope]
invisible=1
