# Erzeugt von matugen (templates/mako.ini) – hier nichts ändern
# Stil: Liquid Glass – halbdurchsichtig, Blur macht niri bzw. Hyprland (Regel "notifications")
font=Inter 11
width=380
height=160
# Rand außerhalb der Fläche (10 wie der Waybar-Rand), innen nur unten Abstand
# zwischen den Nachrichten – sonst zeichnet der Compositor den Rand mit weich
outer-margin=10
margin=0,0,10,0
padding=14,16
border-size=1
border-radius=20
icons=1
max-icon-size=56
icon-location=left
default-timeout=5000
# Manche Apps (z. B. Screenshots) wollen "nie ausblenden" – ignorieren
ignore-timeout=1
max-visible=5
layer=overlay
anchor=top-right

background-color=#{{colors.surface.default.hex_stripped}}73
text-color=#{{colors.on_surface.default.hex_stripped}}
border-color=<* if {{ is_dark_mode }} *>#ffffff30<* else *>#0000001f<* endif *>
progress-color=over #{{colors.primary_container.default.hex_stripped}}

format=<b>%s</b>\n<span color="#{{colors.on_surface_variant.default.hex_stripped}}">%b</span>

[urgency=low]
border-color=<* if {{ is_dark_mode }} *>#ffffff18<* else *>#00000012<* endif *>

[urgency=critical]
border-color=#{{colors.error.default.hex_stripped}}
default-timeout=0

[mode=do-not-disturb]
invisible=1
