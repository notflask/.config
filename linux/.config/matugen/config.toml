# Farben neu erzeugen + alles neu laden: ~/.config/matugen/theme.sh
[config]

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.niri-colors]
input_path  = "~/.config/matugen/templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.mako]
input_path  = "~/.config/matugen/templates/mako.ini"
output_path = "~/.config/mako/config"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Apps: GTK (adw-gtk3 / libadwaita) und Qt/KDE (Dolphin, Okular …)
[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.kdeglobals]
input_path  = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.config/kdeglobals"

# MangoHud (gaming-mode)
[templates.mangohud]
input_path  = "~/.config/matugen/templates/MangoHud.conf"
output_path = "~/.config/MangoHud/MangoHud.conf"

# Firefox (Pywalfox-Erweiterung liest das pywal-Format, theme.sh ruft
# danach `pywalfox update`)
[templates.pywalfox]
input_path  = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"
