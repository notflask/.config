# Farben neu erzeugen + alles neu laden: ~/.config/matugen/theme.sh
[config]

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.niri-colors]
input_path  = "~/.config/matugen/templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"

# Farben und Glasflächen hell/dunkel (Taskleiste)
[templates.glass-colors]
input_path = "~/.config/matugen/templates/glass-colors.css"
output_path = "~/.config/quickshell/taskbar/colors.css"

[templates.glass]
input_path = "~/.config/matugen/templates/glass.css"
output_path = "~/.config/quickshell/taskbar/glass.css"

[templates.mako]
input_path  = "~/.config/matugen/templates/mako.ini"
output_path = "~/.config/mako/config"

# Ghostty und fastfetch in den Farben des Wallpapers 
[templates.ghostty]
input_path  = "~/.config/matugen/templates/ghostty-theme"
output_path = "~/.config/ghostty/themes/matugen"

# Neovim: Farbschema `matugen` (plugins/ui.lua)
[templates.nvim]
input_path  = "~/.config/matugen/templates/nvim-colors.lua"
output_path = "~/.config/nvim/colors/matugen.lua"

[templates.fastfetch-minimal]
input_path  = "~/.config/matugen/templates/fastfetch-minimal.jsonc"
output_path = "~/.config/fastfetch/minimal.jsonc"

# mako im minimalen Stil 
[templates.mako-flat]
input_path  = "~/.config/matugen/templates/mako-flat.ini"
output_path = "~/.config/mako/config-flat"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Apps: GTK (adw-gtk3 / libadwaita) und Qt/KDE (Dolphin, Okular …)
[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.kdeglobals]
input_path  = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.config/kdeglobals"

# MangoHud (gaming-mode)
[templates.mangohud]
input_path  = "~/.config/matugen/templates/MangoHud.conf"
output_path = "~/.config/MangoHud/MangoHud.conf"

# Firefox (Pywalfox-Erweiterung liest das pywal-Format, theme.sh ruft
# danach `pywalfox update` und `pywalfox dark|light`). Im hellen Modus nimmt
# Pywalfox color0 als Schrift und color7 für die Flächen (wie ein pywal-
# Schema mit dunklem color0) – das Template ordnet die Farben dafür um.
[templates.pywalfox]
input_path  = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"

# Firefox: Adressleisten-Vorschläge (Profilordner siehe theme.sh)
[templates.firefox-userchrome]
input_path  = "~/.config/matugen/templates/firefox-userchrome.css"
output_path = "~/.cache/matugen/firefox-userChrome.css"

# Spotify (Spicetify): Spotify liest die Datei über einen Symlink im
# Paket und lädt sie bei Änderungen selbst neu
[templates.spicetify]
input_path  = "~/.config/matugen/templates/spicetify-colors.css"
output_path = "~/.cache/matugen/spicetify-colors.css"

# Hyprlock (hyprlock.conf bindet die Datei ein)
[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

# gtklock (Sperrbildschirm unter Arch, `wm lock`)
[templates.gtklock]
input_path  = "~/.config/matugen/templates/gtklock.css"
output_path = "~/.config/gtklock/style.css"

# Discord (Vencord): theme.sh trägt die Datei selbst unter „aktive Themes“ ein
[templates.vencord]
input_path  = "~/.config/matugen/templates/vencord.theme.css"
output_path = "~/.config/Vencord/themes/matugen.theme.css"

# Telegram Desktop: Palette; theme.sh packt sie mit dem Chat-Hintergrund zu
# ~/.cache/matugen/matugen.tdesktop-theme und bietet sie Telegram an
[templates.telegram]
input_path  = "~/.config/matugen/templates/telegram.tdesktop-theme"
output_path = "~/.cache/matugen/telegram/colors.tdesktop-theme"
