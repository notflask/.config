# Erzeugt von matugen (templates/MangoHud.conf) – hier nichts ändern.
# MangoHud für gaming-mode: Shift rechts + F12 blendet ein/aus,
# Shift rechts + F9 setzt Durchschnitt und 1%-Low zurück.
# Farben aus dem Hintergrundbild, Ampel: rot / gelb / grün.

## Aussehen: kompakte Glas-Tabelle oben links
legacy_layout=false
position=top-left
offset_x=12
offset_y=12
round_corners=12
background_alpha=0.4
background_color=111318
font_size=18
text_color=e2e2e9
text_outline
text_outline_color=000000
text_outline_thickness=1.5
table_columns=3

## Bildrate: Farbe nach FPS, dazu Durchschnitt und 1%-Low
fps
fps_color_change
fps_value=60,120
fps_color=ffb4ab,f0c674,8fd19e
fps_metrics=avg,0.01
show_fps_limit
frametime
frame_timing
frametime_color=acc7ff

## Grafikkarte
gpu_text=RTX 4060
gpu_color=acc7ff
gpu_stats
gpu_load_change
gpu_load_value=60,90
gpu_load_color=8fd19e,f0c674,ffb4ab
gpu_temp
gpu_core_clock
gpu_power
vram
vram_color=ddbcdf

## Prozessor
cpu_text=i5-12500H
cpu_color=bec6dc
cpu_stats
cpu_load_change
cpu_load_value=60,90
cpu_load_color=8fd19e,f0c674,ffb4ab
cpu_temp
cpu_mhz
ram
ram_color=ddbcdf

## Kontrolle: drosselt etwas? läuft GameMode, NTSYNC, VSync/Tearing?
throttling_status
gamemode
winesync
present_mode

toggle_hud=Shift_R+F12
