# Farben aus dem Hintergrundbild (matugen, hell oder dunkel)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot  # This takes a 'snapshot' of your current screen
    color = $lock_background
    blur_passes = 2 # 0 disables blurring
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = $lock_brightness # dunkelt das Bild ab
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $lock_outer
    inner_color = $lock_inner
    font_color = $lock_text
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box
    hide_input = false
    
    position = 0, 20
    halign = center
    valign = bottom
}
