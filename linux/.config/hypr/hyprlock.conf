# hyprlock – Sperrbildschirm im Liquid-Glass-Stil (Niri und Hyprland)
#
# Wie bei macOS: Hintergrundbild, oben Datum, große Uhr und Wetter, unten
# ein kleines Passwortfeld als Glas-Pille. In den Ecken:
# Mitteilungen seit dem Sperren (oben links), VPN, Netz und Akku (oben
# rechts), Musikkarte mit Knöpfen (unten links), Ruhezustand, Neustart und
# Ausschalten (unten rechts). Die Mitte bleibt frei fürs Bild.
#
# Farben aus dem Hintergrundbild (matugen, hell oder dunkel).
# Bilder (Hintergrund mit Verlauf, Knöpfe, Musikkarte):
# hyprlock-art.py, Texte: hyprlock-status.sh – beide in ~/.cache/hyprlock.
# Zum Testen: hyprlock (Passwort entsperrt wie immer)

source = ~/.config/hypr/hyprlock-colors.conf

$font = Inter
$font_clock = Inter Display SemiBold
$status = ~/.config/hypr/hyprlock-status.sh
$art = ~/.cache/hyprlock

general {
    hide_cursor = false        # Knöpfe brauchen die Maus
    ignore_empty_input = true  # Enter ohne Passwort zählt nicht als Fehlversuch
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1   # weich auslaufend (easeOutQuint)
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, glass
    animation = fadeOut, 1, 3, linear
    animation = inputFieldColors, 1, 4, glass
    animation = inputFieldFade, 1, 4, glass
    animation = inputFieldWidth, 1, 4, glass
    animation = inputFieldDots, 1, 2, glass
}

# ── Hintergrund ───────────────────────────────────────────────
# lock.jpg: das Bild, oben und unten sanft abgedunkelt (hyprlock-art.py
# prepare, ruft theme.sh nach jedem Bildwechsel auf)
background {
    monitor =
    path = $art/lock.jpg
    color = $lock_background
    zindex = -2
}

shape {
    monitor =
    size = 100%, 100%
    color = $lock_tint
    rounding = 0
    zindex = -1
}

# ── Oben: Datum, Uhr, Wetter ──────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d. %B"
    color = $lock_clock_dim
    font_size = 20
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $lock_clock_shadow
    position = 0, -80
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    color = $lock_clock
    font_size = 132
    font_family = $font_clock
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $lock_clock_shadow
    shadow_boost = 1.1
    position = 0, -108
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] $status weather
    color = $lock_clock_dim
    font_size = 15
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_clock_shadow
    position = 0, -318
    halign = center
    valign = top
}

# ── Ecken oben: Mitteilungen links, Status rechts ─────────────
label {
    monitor =
    text = cmd[update:3000] $status notifications
    color = $lock_clock_dim
    font_size = 13
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_clock_shadow
    position = 36, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:5000] $status status
    color = $lock_clock_dim
    font_size = 13
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_clock_shadow
    position = -36, -30
    halign = right
    valign = top
}

# ── Unten Mitte: Passwort ─────────────────────────────────────
input-field {
    monitor =
    size = 260, 42
    rounding = -1
    outline_thickness = 2
    outer_color = $lock_rim
    inner_color = $lock_glass
    font_color = $lock_text
    font_family = $font
    check_color = $lock_accent
    fail_color = $lock_error
    capslock_color = $lock_warn

    dots_size = 0.22
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false

    # $LAYOUT: Tastaturbelegung wie in hyprland.lua (us,ru,ua,de)
    placeholder_text = <span alpha="60%">Passwort  ·  $LAYOUT[US,RU,UA,DE]</span>
    check_text = <span alpha="70%">Prüfe …</span>
    fail_text = <span>$PAMFAIL</span> <span alpha="70%">($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 8
    shadow_color = $lock_shadow
    position = 0, 96
    halign = center
    valign = bottom
}

# ── Unten links: Musikkarte (nur wenn etwas läuft oder pausiert) ──
# Karte 460×112 aus hyprlock-art.py, die drei Knöpfe liegen rechts darin
# (je 40×40, 14 px Rand). Ohne Musik: leere Bilder.
image {
    monitor =
    path = $art/blank.png
    reload_time = 1
    reload_cmd = $status media-card
    size = 112
    rounding = 0
    border_size = 0
    shadow_passes = 2
    shadow_size = 12
    shadow_color = $lock_shadow
    position = 36, 36
    halign = left
    valign = bottom
}

image {
    monitor =
    path = $art/blank.png
    reload_time = 1
    reload_cmd = $status button prev
    size = 40
    rounding = 0
    border_size = 0
    onclick = playerctl previous
    position = 354, 72   # 36 + 460 − 14 − 3 × 40 − 8
    halign = left
    valign = bottom
    zindex = 1
}

image {
    monitor =
    path = $art/blank.png
    reload_time = 1
    reload_cmd = $status button toggle
    size = 40
    rounding = 0
    border_size = 0
    onclick = playerctl play-pause
    position = 398, 72
    halign = left
    valign = bottom
    zindex = 1
}

image {
    monitor =
    path = $art/blank.png
    reload_time = 1
    reload_cmd = $status button next
    size = 40
    rounding = 0
    border_size = 0
    onclick = playerctl next
    position = 442, 72
    halign = left
    valign = bottom
    zindex = 1
}

# ── Unten rechts: Ruhezustand, Neustart, Ausschalten ──────────
# Wie im Startmenü (quickshell/taskbar/Power.qml) mit systemctl
image {
    monitor =
    path = $art/buttons/suspend.png
    size = 44
    rounding = 0
    border_size = 0
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $lock_shadow
    onclick = systemctl suspend
    position = -148, 38
    halign = right
    valign = bottom
}

image {
    monitor =
    path = $art/buttons/reboot.png
    size = 44
    rounding = 0
    border_size = 0
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $lock_shadow
    onclick = systemctl reboot
    position = -92, 38
    halign = right
    valign = bottom
}

image {
    monitor =
    path = $art/buttons/poweroff.png
    size = 44
    rounding = 0
    border_size = 0
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $lock_shadow
    onclick = systemctl poweroff
    position = -36, 38
    halign = right
    valign = bottom
}
