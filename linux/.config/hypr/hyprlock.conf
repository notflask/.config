general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot  # This takes a 'snapshot' of your current screen
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2 # 0 disables blurring
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5 # This darkens the screen
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(50, 50, 50)
    inner_color = rgb(10, 10, 10)
    font_color = rgb(100, 100, 100)
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box
    hide_input = false
    
    position = 0, 20
    halign = center
    valign = bottom
}
