# hyprlock – Sperrbildschirm im Liquid-Glass-Stil (Niri und Hyprland)
#
# Wie bei macOS: Hintergrundbild, oben Datum und große Uhr, unten nur ein
# kleines Passwortfeld als Glas-Pille.
# Farben aus dem Hintergrundbild (matugen, hell oder dunkel).
# Zum Testen: hyprlock (Passwort entsperrt wie immer)

source = ~/.config/hypr/hyprlock-colors.conf

$font = Inter
$font_clock = Inter Display SemiBold
$status = ~/.config/hypr/hyprlock-status.sh

general {
    hide_cursor = true
    ignore_empty_input = true  # Enter ohne Passwort zählt nicht als Fehlversuch
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1   # weich auslaufend (easeOutQuint)
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, glass
    animation = fadeOut, 1, 3, linear
    animation = inputFieldColors, 1, 4, glass
    animation = inputFieldFade, 1, 4, glass
    animation = inputFieldWidth, 1, 4, glass
    animation = inputFieldDots, 1, 2, glass
}

# ── Hintergrund: das Hintergrundbild, leicht abgedunkelt ──────
background {
    monitor =
    path = ~/.cache/hyprlock/wallpaper.jpg  # verkleinerte Kopie, siehe matugen/theme.sh
    color = $lock_background
    zindex = -3
}

shape {
    monitor =
    size = 100%, 100%
    color = $lock_tint
    rounding = 0
    zindex = -2
}

# ── Uhr ───────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d. %B"
    color = $lock_clock_dim
    font_size = 20
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $lock_clock_shadow
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    color = $lock_clock
    font_size = 120
    font_family = $font_clock
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $lock_clock_shadow
    shadow_boost = 1.1
    position = 0, -120
    halign = center
    valign = top
}

# ── Passwort: kleine Glas-Pille unten (wie bei macOS) ─────────
input-field {
    monitor =
    size = 240, 40
    rounding = -1
    outline_thickness = 2
    outer_color = $lock_rim
    inner_color = $lock_glass
    font_color = $lock_text
    font_family = $font
    check_color = $lock_accent
    fail_color = $lock_error
    capslock_color = $lock_warn

    dots_size = 0.22
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false

    placeholder_text = <span alpha="60%">Passwort eingeben</span>
    check_text = <span alpha="70%">Prüfe …</span>
    fail_text = <span>$PAMFAIL</span> <span alpha="70%">($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 8
    shadow_color = $lock_shadow
    position = 0, 90
    halign = center
    valign = bottom
}

# ── Musik unter der Uhr (nur wenn etwas läuft) ─────────────────
label {
    monitor =
    text = cmd[update:2000] $status media
    color = $lock_clock_dim
    font_size = 13
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_clock_shadow
    position = 0, -310
    halign = center
    valign = top
}
