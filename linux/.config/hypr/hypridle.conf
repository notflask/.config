# hypridle – Auto-Sperre in Niri und Hyprland
#
# Pausiert, solange eine App das Sperren verhindert: Videos (Firefox, VLC),
# Spiele, Anrufe.
# Zeiten in Sekunden. Nach Änderungen: systemctl --user restart hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock  # nie zwei Sperrbildschirme
    before_sleep_cmd = loginctl lock-session  # vor Standby sperren
    after_sleep_cmd = screen-power on         # Bildschirme sofort wieder an
}

# 40 min: interner Bildschirm dunkler
listener {
    timeout = 2400
    on-timeout = brightnessctl --class=backlight -s set 10%
    on-resume = brightnessctl --class=backlight -r
}

# 45 min: sperren
listener {
    timeout = 2700
    on-timeout = loginctl lock-session
}

# 46 min: Bildschirme aus (Maus oder Taste weckt sie)
listener {
    timeout = 2760
    on-timeout = screen-power off
    on-resume = screen-power on
}
