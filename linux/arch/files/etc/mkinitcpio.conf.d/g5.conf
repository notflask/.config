# initramfs: Plymouth (Ladebildschirm "bgrt" wie boot.plymouth in configuration.nix)
# und i915 früh – Bildschirm sofort in voller Auflösung, Intel vor der NVIDIA
# (nvidia.nix: boot.initrd.kernelModules). Die Hooks sind die Standard-Hooks
# von archinstall plus plymouth direkt nach udev.
MODULES=(i915)
HOOKS=(base udev plymouth autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)
COMPRESSION="zstd"
