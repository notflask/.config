# Kernel-Module – wie nvidia.nix und performance.nix unter NixOS.
# Wirkt nach dem nächsten Neustart (setup.sh baut die initramfs neu).

# NVIDIA: Kernel-Modesetting (Wayland), Framebuffer; CPU schreibt über PAT
# (Write-Combining) in den Grafikspeicher – schneller, Standard bei CachyOS.
# VRAM über Standby retten (elogind ruft dafür nvidia-sleep.sh auf).
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_UsePageAttributeTable=1 NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp

# Hardware-Watchdogs braucht niemand (runit hat keinen) – sie wecken die
# Kerne nur regelmäßig per Interrupt
blacklist iTCO_wdt
blacklist intel_oc_wdt
