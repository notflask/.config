<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Schriften wie fonts.nix unter NixOS: Standard-Reihenfolge, Apple-Emoji
     überall, Monocraft als Ersatz für Minecraftia (Kyrillisch) -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK SC</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK SC</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono CJK SC</family><family>Symbols Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer><family>Apple Color Emoji</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <!-- Apps, die ausdrücklich eine andere Emoji-Schrift verlangen, bekommen
       Apple Color Emoji (Firefox: font.name-list.emoji, firefox/g5.js) -->
  <alias binding="strong">
    <family>Noto Color Emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Noto Emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Twemoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Twemoji Mozilla</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>EmojiOne Color</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>JoyPixels</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Blobmoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <!-- Minecraftia kennt kein Kyrillisch (Telegram, Spotify) -->
  <match target="pattern">
    <test name="family"><string>Minecraftia</string></test>
    <edit name="family" mode="append" binding="strong"><string>Monocraft</string></edit>
  </match>
</fontconfig>
