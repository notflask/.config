# initramfs (nvidia.nix, configuration.nix)
# Intel-Treiber früh laden: Bildschirm sofort in voller Auflösung, und i915
# ist vor der NVIDIA da – sonst hängen Electron-Apps auf Hybrid-Laptops
add_drivers+=" i915 "
# Kein Plymouth: runit beendet es nicht, ly wartete dann minutenlang
omit_dracutmodules+=" plymouth "
hostonly="yes"
