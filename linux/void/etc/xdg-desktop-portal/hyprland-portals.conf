# Portale unter Hyprland – wie xdg.portal.config.hyprland in hyprland.nix:
# Bildschirm teilen/Screenshots über Hyprland, Rest GTK, Dateidialog von
# KDE (Dolphin-Stil), Passwörter über KWallet. Überschreibt die Vorgabe des
# Pakets (/usr/share/xdg-desktop-portal/hyprland-portals.conf).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.Secret=kwallet
